[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engramlm"
version = "0.1.0"
description = "Causal, salience-gated external memory for Hugging Face causal language models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
requires-python = ">=3.11"
keywords = ["language-models", "memory", "transformers", "long-context", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.5",
    "transformers>=5.0",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["peft>=0.17", "datasets>=3.0"]
viz = ["matplotlib>=3.9", "pillow>=10.4"]

[project.scripts]
engramlm = "engramlm.cli:main"

[project.urls]
Homepage = "https://github.com/Sanika0212/EngramLM"
Issues = "https://github.com/Sanika0212/EngramLM/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engramlm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS for the self-contained HTML report.
"src/engramlm/inspector.py" = ["E501"]
# Embedded SVG template for the README banner.
"scripts/make_banner.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/engramlm"]

[[tool.mypy.overrides]]
module = ["transformers.*", "peft.*", "datasets.*", "safetensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: longer-running integration tests"]

[tool.coverage.run]
source = ["engramlm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
